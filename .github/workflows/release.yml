# Publishes a release to Maven Central and to GitHub when a version tag is
# pushed. A manual run is a dry run: it builds, tests and signs, uploads
# nothing and creates no GitHub release.

name: Release

on:
  push:
    tags:
    - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Test the release version script
      run: .github/scripts/release-version-test.sh
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        server-id: central
        server-username-env-var: CENTRAL_USERNAME
        server-password-env-var: CENTRAL_PASSWORD
    - name: Determine the Maven version
      id: version
      run: |
        fess_version="$(mvn -B -q org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate -Dexpression=project.parent.version -DforceStdout)"
        if [ "$GITHUB_EVENT_NAME" = "push" ]; then
          # actions/checkout stores an annotated tag as a lightweight reference.
          git fetch --force origin "+refs/heads/main:refs/remotes/origin/main" "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          maven_version="$(.github/scripts/release-version.sh "$GITHUB_REF_NAME" "$fess_version")"
        else
          maven_version="${fess_version}-0.0.0"
        fi
        echo "Maven version: $maven_version"
        echo "maven_version=$maven_version" >> "$GITHUB_OUTPUT"
    - name: Set the Maven version
      env:
        MAVEN_VERSION: ${{ steps.version.outputs.maven_version }}
      run: mvn -B org.codehaus.mojo:versions-maven-plugin:2.18.0:set -DnewVersion="$MAVEN_VERSION" -DgenerateBackupPoms=false
    - name: Import the signing key
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      run: printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
    - name: Build, sign and deploy
      env:
        CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
        CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        SKIP_PUBLISHING: ${{ github.event_name != 'push' }}
      run: mvn -B -Prelease deploy -DskipPublishing="$SKIP_PUBLISHING" -DautoPublish=true
    - uses: actions/upload-artifact@v7
      with:
        name: release-jar
        path: |
          target/fess-ds-giirii-${{ steps.version.outputs.maven_version }}.jar
          target/fess-ds-giirii-${{ steps.version.outputs.maven_version }}.jar.asc
        if-no-files-found: error

  github-release:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - name: Fetch the annotated tag
      run: git fetch --force origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
    - uses: actions/download-artifact@v8
      with:
        name: release-jar
        path: dist
    - name: Create the GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" --verify-tag --notes-from-tag --title "$GITHUB_REF_NAME" dist/*
